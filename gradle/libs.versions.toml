[versions]
# 构建版本
versionCode = "2026073111"
# 版本号
versionName = "1.0.0"
# 包名
namespace = "com.seanchen.xinchat"
# 编译 SDK 版本
compileSdk = "37"
# 最低支持的SDK版本
minSdk = "23"
# 目标 SDK 版本
targetSdk = "37"

# 构建工具版本
agp = "9.2.1"
kotlin = "2.2.10"

# 核心库版本
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycleRuntimeKtx = "2.11.0"
androidxDatastore = "1.1.7"

# 测试框架版本
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# Jetpack Compose 相关版本
composeBom = "2026.02.01"

# 导航相关版本
navigation3 = "1.0.1"
lifecycleViewModelNavigation3 = "2.10.0"

# 序列化相关版本
kotlinxSerializationJson = "1.10.0"

# 图片加载相关版本
# Coil Compose 图片加载库: https://coil-kt.github.io/coil/compose/
coilCompose = "2.7.0"

# UI 相关版本
# AndroidX AppCompat: https://developer.android.com/jetpack/androidx/releases/appcompat
appcompat = "1.7.1"
# Material Design Components: https://github.com/material-components/material-components-android
material = "1.14.0-alpha10"

# 网络请求
okhttp = "5.3.2"
retrofit = "3.0.0"
retrofit2KotlinxSerializationConverter = "1.0.0"
# OkHttp 日志拦截器: https://github.com/square/okhttp/tree/master/okhttp-logging-interceptor
loggingInterceptor = "5.3.2"
# Chucker 网络调试工具: https://github.com/ChuckerTeam/chucker
# 说明: 通过 OkHttp 拦截器机制在应用通知栏显示网络请求功能
chucker = "4.3.1"

timber = "5.0.1"

# 依赖注入相关版本
# Hilt 依赖注入框架: https://developer.android.com/training/dependency-injection/hilt-android
# GitHub: https://github.com/google/dagger
# 说明: 基于 Dagger 的 Android 依赖注入库
hilt = "2.59.2"
# KSP (Kotlin Symbol Processing): https://github.com/google/ksp
# 说明: Kotlin 注解处理器，用于代码生成
hiltLifecycleViewModelCompose = "1.3.0"

ksp = "2.3.4"

# Core Library Desugaring 版本
# Android Desugar JDK Libs: https://developer.android.com/studio/write/java11-minimal-support-table
# 说明: 支持在低版本 Android 上使用 Java 11+ API
androidDesugarJdkLibs = "2.1.5"

# 数据库相关版本
room = "2.8.4"

# 封装的组件库
xinComponent = "v0.1.5"

# 动画相关版本
# Lottie Compose 动画库: https://airbnb.io/lottie/#/android-compose
# 说明: 支持 After Effects 动画的 Compose 库
lottieCompose = "6.7.1"

# 骨架屏
# https://github.com/valentinilk/compose-shimmer
composeShimmer = "1.3.3"

# 调试工具相关版本
# LeakCanary 内存泄漏检测工具: https://github.com/square/leakcanary
# 说明: 仅在 debug 构建中使用，用于检测内存泄漏
leakcanaryAndroid = "2.14"

# 启动页相关版本
# AndroidX Core Splashscreen: https://developer.android.com/jetpack/androidx/releases/core
# 说明: 提供启动画面 API，兼容 Android 12+ 的启动画面
androidxCoreSplashscreen = "1.2.0"

toaster = "13.8"

# 数据存储相关版本
# 腾讯 MMKV 高性能存储: https://github.com/Tencent/MMKV
mmkv = "2.4.0"

# 权限相关版本
# XXPermissions 权限框架: https://github.com/getActivity/XXPermissions
xxpermissions = "28.0"

[libraries]
# Android核心库
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }

# 封装的组件库CommonWidget
common-widget = { group = "com.github.Akiha678.XinComponent", name = "ui", version.ref = "xinComponent" }

# 测试相关库
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# JetpackCompose相关库
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Navigation 3
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewModelNavigation3" }

# 序列化相关库
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# 网络请求相关库
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
retrofit-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit2KotlinxSerializationConverter" }

# 日志框架
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# 依赖注入相关库
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewModelCompose" }

# 图片加载相关库
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }

# UI 相关库
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# 构建工具相关库
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# Core Library Desugaring 相关库
android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }

# 网络调试相关库
chucker = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
chucker-no-op = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }

# 启动页相关库
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxCoreSplashscreen" }

# Toaster封装库
toaster = { group = "com.github.getActivity", name = "Toaster", version.ref = "toaster"}

# 数据存储相关库
mmkv = { group = "com.tencent", name = "mmkv", version.ref = "mmkv" }

# 动画相关库
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }

# 骨架屏
compose-shimmer = { module = "com.valentinilk.shimmer:compose-shimmer", version.ref = "composeShimmer" }

# 调试工具相关库
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanaryAndroid" }

# 数据库相关库
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }

# 权限相关库
xxpermissions = { module = "com.github.getActivity:XXPermissions",  version.ref = "xxpermissions"}

[plugins]
# Android 相关插件
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

# Kotlin 相关插件
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# 依赖注入相关插件
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# 数据库
room = { id = "androidx.room", version.ref = "room" }

# 自定义插件名称
xinchat-android-application-compose = { id = "com.seanchen.xinchat.android.application.compose" }
xinchat-android-feature = { id = "com.seanchen.xinchat.android.feature" }
xinchat-android-library = { id = "com.seanchen.xinchat.android.library" }
xinchat-android-library-compose = { id = "com.seanchen.xinchat.android.library.compose" }
xinchat-hilt = { id = "com.seanchen.xinchat.hilt" }
